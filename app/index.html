<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Appliqué avant le rendu pour éviter un flash de thème. Deux thèmes seulement : sombre (défaut) et clair.
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark")
      } catch (e) {
        document.documentElement.classList.add("dark")
      }
    </script>
    <title>Baridi - Fancontroller</title>
    <link rel="icon" type="image/png" href="/src/assets/baridi-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
