[package]
name = "fancontroller"
version = "2.0.0"
description = "Contrôle des ventilateurs ASUS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fancontroller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
