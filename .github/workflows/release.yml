name: Release

# Publie l'installateur Windows quand on pousse une étiquette de version (par exemple v2.1.0).
#   git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que l'étiquette correspond aux versions du projet
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $package = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $go = (Select-String -Path controller/main.go -Pattern 'const version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "étiquette=$tag package.json=$package tauri.conf.json=$tauri Cargo.toml=$cargo main.go=$go"
          if (($package, $tauri, $cargo, $go | Where-Object { $_ -ne $tag }).Count -gt 0) {
            Write-Error "Les versions ne sont pas alignées sur l'étiquette $tag."
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Dépendances de l'interface
        working-directory: app
        run: bun install --frozen-lockfile

      # tauri build lance « bun run core && bun run build » (voir tauri.conf.json) puis produit l'installateur NSIS.
      - name: Installateur
        working-directory: app
        run: bun run tauri build

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
